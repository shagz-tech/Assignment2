<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>💰 Expense Tracker</h1>
    </header>

    <main class="container">

        <section class="form-section">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <input type="text" id="titleInput" placeholder="Expense Title" required>
                <input type="number" id="amountInput" placeholder="Amount (₹)" required>
                <select id="categoryInput">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="filter-section">
            <label for="filterCategory">Filter by Category:</label>
            <select id="filterCategory">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </section>

        <section class="list-section">
            <h2>Expense List</h2>
            <ul id="expenseList"></ul>
        </section>

        <section class="total-section">
            <h2>Total Expense: ₹<span id="totalAmount">0</span></h2>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Expense Tracker | Week 5 JavaScript Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
